
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pet Shelter</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container py-5">
        <h1 class="mb-4">Pet Shelter</h1>
        <div id="pet-container" class="row"></div>
        <button id="loadContent" class="btn btn-primary mt-4">Load More</button>
        <button id="addMore" class="btn btn-success mt-4 ms-2">Add Pet</button>
    </div>

    <div class="modal fade" id="petModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-title"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modal-body"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addPetModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="add-pet-form">
                    <div class="modal-header">
                        <h5 class="modal-title">Add New Pet</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="text" id="pet-name" class="form-control mb-2" placeholder="Name" required>
                        <input type="text" id="pet-type" class="form-control mb-2" placeholder="Type" required>
                        <input type="text" id="pet-age" class="form-control mb-2" placeholder="Age" required>
                        <input type="text" id="pet-sex" class="form-control mb-2" placeholder="Sex" required>
                        <input type="text" id="pet-image" class="form-control mb-2" placeholder="Image Path" required>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Add</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
